name: sliver

# Application containers reach PostgreSQL and MinIO on the Compose network; only the
# loopback interface of the host is ever published.
x-app-environment: &app-environment
  # The API builds the database URL from these parts with proper escaping; an explicit
  # DATABASE_URL in .env still takes precedence.
  DATABASE_URL: ${DATABASE_URL:-}
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${S3_BUCKET:-sliver-private}
  S3_REGION: ${S3_REGION:-us-east-1}
  FACILITATOR_URL: ${FACILITATOR_URL:-https://xrpl-facilitator-testnet.t54.ai}
  XRPL_RPC_URL: ${XRPL_RPC_URL:-https://s.altnet.rippletest.net:51234/}
  DROPS_PER_USD: ${DROPS_PER_USD:-400000}
  # Seller accounts and sessions. Empty passwords leave the demo accounts unable to sign in.
  SLIVER_SELLER_PASSWORD: ${SLIVER_SELLER_PASSWORD:-}
  SLIVER_REVIEWER_PASSWORD: ${SLIVER_REVIEWER_PASSWORD:-}
  SLIVER_ALLOWED_ORIGINS: ${SLIVER_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}

services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    build:
      context: ./docker/minio
    image: sliver-minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  api:
    build:
      context: ./apps/api
    image: sliver-api:dev
    environment: *app-environment
    ports:
      - "127.0.0.1:${SLIVER_API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./apps/api
    image: sliver-api:dev
    command: ["python", "-m", "sliver_api.worker"]
    environment: *app-environment
    volumes:
      - ./apps/api:/app
    depends_on:
      # The API runs migrations on start; the worker waits for it.
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/sliver-worker.heartbeat') > 30)"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: ./apps/web
    image: sliver-web:dev
    # Vite can exit when an editor replaces a file mid-read through the bind mount; come back up.
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${SLIVER_WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      # Keep the image's Linux node_modules instead of the host's.
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
  minio_data:
