name: Seller application CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  api:
    name: API behavior and access control
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install API dependencies
        run: |
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install -e apps/api --no-deps
      - name: Verify API behavior
        run: python -m pytest apps/api/tests -q

  web:
    name: Frontend types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --prefix apps/web
      - run: npm run typecheck --prefix apps/web
      - run: npm run build --prefix apps/web

  seller-journey:
    name: Foundation and seller integration
    needs: [api, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sliver-app-${{ github.run_id }}-${{ github.run_attempt }}
      SLIVER_SELLER_A_PASSWORD: ci-seller-a-password
      SLIVER_SELLER_B_PASSWORD: ci-seller-b-password
      SLIVER_REVIEWER_PASSWORD: ci-reviewer-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install API and browser dependencies
        run: |
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install -e apps/api --no-deps
          npm ci --prefix apps/web
          cd apps/web
          npx playwright install --with-deps chromium
      - name: Verify repeatable infrastructure installation
        run: |
          set -euo pipefail
          make doctor
          make install
          printf '\n# CI preservation marker\n' >> .env
          sha256sum .env > "$RUNNER_TEMP/sliver-env.sha256"
          make install
          sha256sum --check "$RUNNER_TEMP/sliver-env.sha256"
      - name: Start PostgreSQL and private object storage
        run: |
          set -euo pipefail
          make dev-start
          make ps
          for service in postgres minio; do
            container=$(docker compose --env-file .env -f compose.yml ps --all --quiet "$service")
            test -n "$container"
            state=$(docker inspect --format '{{.State.Status}} {{.State.Health.Status}}' "$container")
            test "$state" = 'running healthy'
          done
      - name: Initialize the local demo and start the API
        run: |
          python -m sliver_api.seed
          uvicorn sliver_api.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/sliver-api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/sliver-api.pid"
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8000/api/health
      - name: Verify seller, reviewer, and public catalog journey
        run: npm run test:e2e --prefix apps/web
      - name: Failure diagnostics
        if: failure()
        run: |
          make logs
          if [ -f "$RUNNER_TEMP/sliver-api.log" ]; then
            cat "$RUNNER_TEMP/sliver-api.log"
          fi
      - name: Keep browser verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seller-browser-evidence
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop application and isolated infrastructure
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/sliver-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/sliver-api.pid")" 2>/dev/null || true
          fi
          make dev-stop
          containers=$(docker compose --env-file .env -f compose.yml ps --all --quiet)
          test -z "$containers"
