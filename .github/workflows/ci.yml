name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  COMPOSE_PROJECT_NAME: sliver-ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  quality:
    name: Foundation quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned linters
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/sliver-linters"
          mkdir -p "$tools"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tools/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tools/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$tools/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $tools/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$tools/shellcheck.tar.xz" -C "$tools" --strip-components=1 shellcheck-v0.11.0/shellcheck
          echo "$tools" >> "$GITHUB_PATH"

      - name: Check shell and workflow syntax
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            sh -n "$script"
          done
          shellcheck scripts/*.sh
          actionlint

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f compose.yml config --quiet
