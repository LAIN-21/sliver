# Demo catalog loaded by `make seed`. Team-owned content: edit freely, then re-run `make seed`.
# Each dataset is published in full plus one Resource ("sliver") per value of `slice_by`.
# With `slice_period = "month"`, a date column is sliced by calendar month.
# Prices are USD minor units (cents).

[[sellers]]
key = "harbour"
email = "harbour-analytics@sliver.local"
display_name = "Harbour Analytics (demo seller)"

[[sellers]]
key = "strait"
email = "strait-line-data@sliver.local"
display_name = "Strait Line Data (demo seller)"

[[datasets]]
file = "sg-berth-waiting-times.csv"
seller = "harbour"
title = "Singapore berth waiting times"
description = "Daily average and 90th-percentile berth waiting hours at four Singapore container terminals, split by vessel class (feeder, panamax, ultra-large)."
category = "port-operations"
tags = ["singapore", "port", "berth", "congestion", "terminal", "vessel"]
time_column = "date"
slice_by = "date"
slice_period = "month"
price_minor = 1200
slice_price_minor = 450

[datasets.provenance]
source = "Synthetic demo data generated by the Sliver team"
method = "Deterministic simulation (examples/datasets/generate.py)"
collected_at = "2026-11-01"
rights_statement = "Synthetic data created for the Sliver demo; free to redistribute."

