# CodeRabbit reviews each ready (non-draft) pull request once, when it is opened, whatever its base
# branch, so stacked PRs are reviewed without waiting for their base to merge into `main`. It does not
# re-review on later pushes. Draft PRs are not reviewed automatically. Comment `@coderabbitai review`
# to request a review or another run.
reviews:
  auto_review:
    enabled: true
    auto_incremental_review: false
    base_branches:
      - ".*"
