# CodeRabbit reviews each ready (non-draft) pull request that targets `main` once, when it is
# opened, and does not re-review on later pushes. Draft PRs and PRs targeting other branches
# (for example stacked PRs) are not reviewed automatically. Comment `@coderabbitai review` to
# request a review or another run.
reviews:
  auto_review:
    enabled: true
    auto_incremental_review: false
